# ============================================================
# Netlify 部署配置
# ------------------------------------------------------------
# 关键：仓库根目录下有一个 api/ 文件夹，它是 Vercel 风格的函数目录。
# Netlify 默认会把根目录的 api/ 当成自己的函数目录，导致
#   "Directory import '/var/task/api' is not supported"
# 所以这里必须显式声明：
#   functions = "netlify/functions"
# 让 Netlify 只认我们自己的适配器目录。
# ============================================================

[build]
  command = ""
  publish = "public"
  functions = "netlify/functions"

[functions]
  # 显式绑定适配器，避免按目录推断
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  # 所有 /api/* 转给适配器；200 是内部转发，地址栏不变
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
